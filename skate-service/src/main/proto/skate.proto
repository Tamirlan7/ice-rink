  syntax = "proto3";
  package skate;

  option java_multiple_files = true;
  option java_package = "by.tami.grpc.skate";

  service SkateReservationService {
    rpc ReserveSkates(ReserveSkatesReq) returns (ReserveSkatesRes);
  }

  message ReserveSkateItem {
    int64 skateId = 1;
    int64 sessionId = 2;
    int64 ticketId = 3;
  }

  message ReserveSkatesReq {
    repeated ReserveSkateItem items = 1;
  }

  message ReserveSkatesRes {
    repeated int64 skateIds = 1;
  }
