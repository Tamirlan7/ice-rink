spring.application.name=ticket-service
spring.config.import=optional:configserver:${SPRING_CONFIG_SERVER_URI}
spring.profiles.active=default

spring.grpc.client.channel.pricing.target=static://localhost:4840
spring.grpc.client.channel.skate.target=static://localhost:4841
spring.grpc.client.channel.session.target=static://localhost:4842

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all

