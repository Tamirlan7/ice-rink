server:
  port: 8080


spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: user-service-route
              uri: http://localhost:8081
              predicates:
                - Path=/api/v1/users/**

            - id: ticket-service-route
              uri: http://localhost:8082
              predicates:
                - Path=/api/v1/tickets/**

logging:
  level:
    root: DEBUG
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/