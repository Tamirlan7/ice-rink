server:
  port: 8080

jwt:
  keys:
    public:
      path:
        keys/public.pem

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true

          routes:
            - id: auth-service-route
              uri: lb://user-service
              predicates:
                - Path=/api/v1/auth/**
            - id: user-service-route
              uri: lb://user-service
              predicates:
                - Path=/api/v1/users/**

            - id: ticket-service-route
              uri: lb://ticket-service
              predicates:
                - Path=/api/v1/tickets/**
              filters:
                - AuthenticationFilter

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      default-zone: http://localhost:8761/eureka/