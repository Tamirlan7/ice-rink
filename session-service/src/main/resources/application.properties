spring.application.name=session-service
spring.config.import=optional:configserver:http://localhost:8888
spring.profiles.active=default
spring.grpc.server.port=4842

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAPS_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=session-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringSerializer
