syntax = "proto3";

package pricing;

import "google/protobuf/timestamp.proto";

option java_multiple_files = true;
option java_package = "com.tami.grpc.pricing";

service PricingService {
  rpc GetPricings(GetPricingsRequest) returns (GetPricingsResponse);
}

message GetPricingsRequest {

}

message PricingInfo {
  int64 id = 1;
  int32 price = 2;
  string category = 3;
  google.protobuf.Timestamp createdAt = 4;
}

message GetPricingsResponse {
  repeated PricingInfo pricings = 1;
}
