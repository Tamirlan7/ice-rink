spring.application.name=user-service
server.port=0

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# DB Connections
spring.datasource.url=jdbc:postgresql://localhost:5000/ice-skate-db
spring.datasource.username=root
spring.datasource.password=1234
spring.jpa.hibernate.ddl-auto=none
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_schema=user_schema

# Flyway Migrations
spring.flyway.locations=classpath:db/migration
spring.flyway.default-schema=user_schema
spring.flyway.schemas=user_schema
spring.flyway.table=flyway_schema_history
spring.flyway.baseline-on-migrate=true

jwt.keys.public.path=keys/public.pem
jwt.keys.private.path=keys/private.pem
